# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: video-scene-search
services:
    video-scene-search:
        project: src/video-scene-search
        host: azure.ai.agent
        language: csharp
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
            # Model deployment used for this agent.
            # These values are sample defaults. To customize (e.g., different model, capacity, or SKU)
            # for local testing without modifying this file, override via azd environment variable:
            #
            #   azd env set AI_PROJECT_DEPLOYMENTS (Get-Content deployments.local.json -Raw)
            #
            # See deployments.sample.json for the full schema.
            # deployments.local.json is gitignored — safe to put personal settings there.
            deployments:
                - model:
                    format: OpenAI
                    name: gpt-4.1
                    version: "2025-04-14"
                  name: gpt-4.1
                  sku:
                    capacity: 10
                    name: GlobalStandard
infra:
    provider: bicep
    path: ./infra
